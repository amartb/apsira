# The Android compile proof (D-APK-015, AC-10.5; F1's way): an app that
# depends on apsira_storage as every Apsira app does, so its debug build
# compiles the package's Kotlin (ApsiraStoragePlugin.kt, StorageModule.kt)
# beside saf_util, saf_stream, share_plus and image_picker. A path
# dependency inside the repository, never a consumer's pin; apsira_core
# resolves through pubspec_overrides.yaml, as in the package.
name: apsira_storage_example
description: "Consumes apsira_storage and proves its Android half compiles."
publish_to: none
version: 0.3.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  apsira_storage:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
