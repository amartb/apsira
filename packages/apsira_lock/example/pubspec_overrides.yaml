# apsira_lock pins apsira_core, apsira_l10n and apsira_ui by the shared tag,
# and the example uses apsira_app's SystemClock; inside the repository they
# resolve from their directories, as the package's own pubspec_overrides.yaml
# does (D-APK-007).
dependency_overrides:
  apsira_app: { path: ../../apsira_app }
  apsira_core: { path: ../../apsira_core }
  apsira_l10n: { path: ../../apsira_l10n }
  apsira_ui: { path: ../../apsira_ui }
