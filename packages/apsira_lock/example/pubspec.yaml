# The Android compile proof (AC-11.6, as task F1 for apsira_app): an app that
# depends on apsira_lock as every Apsira app does, so its debug build compiles
# the package's Kotlin (ApsiraLockPlugin.kt, ScreenPrivacyModule.kt) and
# local_auth's. Its MainActivity is a FlutterFragmentActivity and its manifest
# declares USE_BIOMETRIC, the two consumer requirements. A path dependency
# inside the repository, never a consumer's pin; apsira_lock's own apsira
# dependencies resolve through pubspec_overrides.yaml, as in the package.
name: apsira_lock_example
description: "Consumes apsira_lock and proves its Android half compiles."
publish_to: none
version: 0.3.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  apsira_app: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.4.0, path: packages/apsira_app } }
  apsira_core: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.4.0, path: packages/apsira_core } }
  apsira_l10n: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.4.0, path: packages/apsira_l10n } }
  apsira_lock:
    path: ../
  apsira_ui: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.4.0, path: packages/apsira_ui } }
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
