# The consumer proof (plan P-6): an app that depends on apsira_ui as every
# Apsira app does, so its bundle holds the package's fonts, licences and
# lockup under packages/apsira_ui/. A path dependency inside the repository,
# never a consumer's pin.
name: apsira_ui_example
description: "Consumes apsira_ui and proves its fonts, licences and lockup load."
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  apsira_ui:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
