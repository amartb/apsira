# The Android compile proof (task F1, ruling R-9): an app that depends on
# apsira_app as every Apsira app does, so its debug build compiles the
# package's Kotlin (ApsiraAppPlugin.kt, ZoneModule.kt). A path dependency
# inside the repository, never a consumer's pin; apsira_app's own apsira
# dependencies resolve through pubspec_overrides.yaml, as in the package.
name: apsira_app_example
description: "Consumes apsira_app and proves its Android half compiles."
publish_to: none
version: 0.2.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  apsira_app:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
