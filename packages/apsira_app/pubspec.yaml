name: apsira_app
description: >-
  The app shell every Apsira app shares: error handlers, the rotating file log
  sink, the start-phase redirect, RestartableRoot, the startup-failure app,
  SystemClock with the zone channel (and its Android half), PendingPort stubs,
  per-install flag files and the About page.
publish_to: none
version: 0.4.0

environment:
  sdk: ^3.13.0
  # The lowest Flutter any live consumer pins (docs/agent-rules.md).
  flutter: ">=3.47.0"

# No third-party dependency (AC-5.1): the apps pass their storage directory in
# (getApplicationSupportDirectory) rather than this package depending on
# path_provider. apsira_* in the git form at the shared tag, with the committed
# pubspec_overrides.yaml (D-APK-007).
dependencies:
  apsira_core: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.4.0, path: packages/apsira_core } }
  apsira_ui: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.4.0, path: packages/apsira_ui } }
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  # The Spanish MaterialLocalizations for the EN/ES widget tests only.
  flutter_localizations:
    sdk: flutter
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.apsiralabs.apsira_app
        pluginClass: ApsiraAppPlugin
