# From viaticum pubspec.yaml @ 78d38e0 and relay pubspec.yaml @ 09b28810 (the
# workmanager and android_alarm_manager_plus pins both apps already have).
name: apsira_jobs
description: "Background work for the Apsira apps that run it: the BackgroundJobs port, JobConstraints, the WorkManager adapter and its fake, the zone-change resync receiver, and the AlarmManagerScheduler of apsira_notify's alarm registry."
publish_to: none
version: 0.5.0

environment:
  sdk: ^3.13.0
  # The lowest Flutter any live consumer pins (docs/agent-rules.md).
  flutter: ">=3.47.0"

# RELAY and VIATICUM only; LYCEUM does not depend on it (LYCEUM D-034, D-APK-011),
# so the alarm-manager plugin stays out of LYCEUM's APK (D-APK-022, ruling R-1 Q1-c).
# apsira_notify (the AlarmScheduler port, the registry, SystemSettings) is named
# in the git form at the shared tag; pubspec_overrides.yaml resolves its closure
# here (D-APK-007).
dependencies:
  android_alarm_manager_plus: ^5.1.2
  apsira_notify: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.5.0, path: packages/apsira_notify } }
  flutter:
    sdk: flutter
  workmanager: ^0.10.10

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  # A plugin so its Android half (ZoneResync.kt, the manifest's receiver) is
  # built into the app; ApsiraJobsPlugin answers the alarm manager's reboot
  # list on apsira_jobs/alarms (README).
  plugin:
    platforms:
      android:
        package: com.apsiralabs.apsira_jobs
        pluginClass: ApsiraJobsPlugin
