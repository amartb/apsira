name: apsira_core
description: >-
  The pure-Dart core every Apsira app shares: Result and Failure, the
  content-free log model, the Clock and IdGen ports with their test fakes, a
  monotonic UUIDv7 generator, the FTS5 match string and canonical JSON.
version: 0.3.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.1.0
  sqlite3: ^2.9.4
  test: ^1.31.0
