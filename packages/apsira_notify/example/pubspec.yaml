# The Android compile proof (AC-16.5, as task F1 for apsira_app): an app that
# depends on apsira_notify as every Apsira app does, so its debug build
# compiles the package's Kotlin (ApsiraNotifyPlugin.kt,
# NotifySettingsModule.kt) and the vendored flutter_local_notifications' Java
# with its public-version patch. A path dependency inside the repository,
# never a consumer's pin; apsira_notify's own dependencies resolve through
# pubspec_overrides.yaml, as in the package.
name: apsira_notify_example
description: "Consumes apsira_notify and proves its Android half compiles."
publish_to: none
version: 0.4.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  apsira_notify:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
