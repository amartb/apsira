# The consumer proof of apsira_link: an app that depends on it as every Apsira
# app does, calls hello once at start and shows the answer. Its Android host
# (K1-02b) is what compiles the package's Kotlin. A path dependency inside the
# repository, never a consumer's pin; apsira_link's own apsira dependency
# resolves through pubspec_overrides.yaml, as in the package.
name: apsira_link_example
description: "Consumes apsira_link and shows APSIRA's hello or why it is unavailable."
publish_to: none
version: 0.5.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  apsira_core: { git: { url: git@github.com:amartb/apsira.git, ref: apsira-v0.5.0, path: packages/apsira_core } }
  apsira_link:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
