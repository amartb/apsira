# The package's own analysis: RELAY's strict language modes and linter rules
# on the pure-Dart recommended lints, for bin/ and test/. lib/ is analysed
# under lib/analysis_options.yaml, the file apps include (RELAY's own, on
# flutter_lints, a dev dependency here so its include resolves).
# `dart analyze --fatal-infos` reports nothing.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - .army/**
    # RELAY's fixtures are inputs, not code under test; their bytes are
    # RELAY's (P-4) and some do not compile on purpose.
    - test/fixtures/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
