name: apsira_tools
description: >-
  RELAY's quality tools (layering lint, l10n check, coverage gate, dependency
  and manifest privacy checks) for every Apsira Flutter app, configured per app
  by tool/apsira_tools.yaml.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  yaml: ^3.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  lints: ^6.1.0
  test: ^1.29.0
