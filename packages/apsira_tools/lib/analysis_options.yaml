# From relay analysis_options.yaml @ 5f606e9
# Static analysis for Relay: the Flutter lints plus the strict language
# modes (07 P0-03 "strict lints"). `flutter analyze` must report no issues.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
  exclude:
    - build/**
    - android/**
    - .army/**
    # Generated code is committed (D-089) but not ours to lint; the format
    # gate still covers it (tool/codegen.sh formats what it writes).
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Test fixtures are inputs, not code under test (P0-02).
    - test/fixtures/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
    - unnecessary_parenthesis
