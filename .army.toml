# .army.toml — Apsira ecosystem repo (brand, briefs, shared Dart packages, and APSIRA under master-app/). Template: project-agents/shared/templates/army.toml.
# The charter (README.md) and docs/decisions.md win over this file.
kind = "dev"
protect_main = true
keystone = false                 # Apsira is not KEYSTONE (charter §1.1, D-APK-004)
autonomous = true
lane = "apsira"
ledger_dir = ".army/sessions"    # gitignored; packages' build/ dirs are Dart's
reports_dir = "docs/sessions"
incidents_dir = "docs/incidents"
decisions_dir = "docs/adr"       # unused: the ecosystem log is docs/decisions.md (D-APK-nnn), a living log, not per-decision ADR files
runbooks_dir = "docs/runbooks"
attribution = "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>\nClaude-Session: https://claude.ai/code/session_014mhg6MaccUokyE38JQDhqT"
e2e = false
formatter_excludes_ledger = true
branch_types = ["phase", "fix", "docs", "chore"]
commit_types = ["feat", "fix", "docs", "test", "refactor", "chore", "style", "perf"]
gate_setup = "bash -c 'for p in packages/*/ master-app/ master-app/hub/ master-app/shared/; do [ -f \"$p/pubspec.yaml\" ] && (cd \"$p\" && (flutter pub get --offline || flutter pub get)); done; true'"

# Merge gates are static per package and run only when that package changed (paths). Each `requires` keeps a gate
# `unavailable` until the package exists. Every package carries one version and the whole set one tag,
# `apsira-v<version>` (D-APK-007); `tool/release.sh` cuts it (operator act). The full check (tool/check.sh, verdict
# line `check: PASS`, the shared-tag rules included) runs only when a validator sets APSIRA_FULL_CHECK=1 at a
# checkpoint or at the unit's end: until every package carries the release's version its `versions equal` step is red.
shared_files = ["docs/decisions.md", "packages/README.md", "**/README.md", "tool/check.sh", "**/CHANGELOG.md",
                "master-app/CLAUDE.md", "master-app/docs/02-decision-log.md", "master-app/docs/05-architecture.md",
                "master-app/docs/08-testing-and-ci.md", "master-app/docs/building.md", "master-app/docs/dependencies.md"]   # master-app: each task edits only its own section
gates = [
  { name = "format", cmd = "bash -c 'dart format --output=none --set-exit-if-changed packages/apsira_*'", proves = "formatting of the apsira packages (packages/third_party/ is vendored and never formatted)", paths = ["packages/**/*.dart"], requires = ["file:packages/apsira_core/pubspec.yaml"] },
  { name = "core",   cmd = "bash -c 'cd packages/apsira_core && dart analyze --fatal-infos && dart test'", proves = "apsira_core analyzes and its tests pass", paths = ["packages/apsira_core/**"], requires = ["file:packages/apsira_core/pubspec.yaml"], mem_gb = 1 },
  { name = "tools",  cmd = "bash -c 'cd packages/apsira_tools && dart analyze --fatal-infos && dart test'", proves = "apsira_tools analyzes and its tests (RELAY's lint fixtures) pass", paths = ["packages/apsira_tools/**"], requires = ["file:packages/apsira_tools/pubspec.yaml"], mem_gb = 1 },
  { name = "ui",     cmd = "bash -c 'cd packages/apsira_ui && flutter analyze && flutter test'", proves = "apsira_ui analyzes; tokens, contrast, type scale, fonts and brand provenance tests pass", paths = ["packages/apsira_ui/**", "apsira-brand/**"], requires = ["file:packages/apsira_ui/pubspec.yaml"], mem_gb = 3 },
  { name = "test",   cmd = "bash -c 'cd packages/apsira_test && flutter analyze && flutter test'", proves = "apsira_test analyzes; the layout checker, golden matrix, font scaler and prop_core tests pass", paths = ["packages/apsira_test/**"], requires = ["file:packages/apsira_test/pubspec.yaml"], mem_gb = 3 },
  { name = "app",    cmd = "bash -c 'cd packages/apsira_app && flutter analyze && flutter test'", proves = "apsira_app analyzes; error handlers, log sink, start redirect, zone channel and install-flag tests pass", paths = ["packages/apsira_app/**"], requires = ["file:packages/apsira_app/pubspec.yaml"], mem_gb = 3 },
  { name = "jobs",   cmd = "bash -c 'cd packages/apsira_jobs && flutter analyze && flutter test'", proves = "apsira_jobs analyzes; the BackgroundJobs port, WorkManager policy and fake tests pass", paths = ["packages/apsira_jobs/**"], requires = ["file:packages/apsira_jobs/pubspec.yaml"], mem_gb = 3 },
  { name = "l10n", cmd = "bash -c 'cd packages/apsira_l10n && flutter analyze && flutter test'", proves = "apsira_l10n analyzes; the D-APK-012 key table in en/es, the delegate and the language setting tests pass", paths = ["packages/apsira_l10n/**"], requires = ["file:packages/apsira_l10n/pubspec.yaml"], mem_gb = 3 },
  { name = "onboarding", cmd = "bash -c 'cd packages/apsira_onboarding && flutter analyze && flutter test'", proves = "apsira_onboarding analyzes and its tests pass", paths = ["packages/apsira_onboarding/**"], requires = ["file:packages/apsira_onboarding/pubspec.yaml"], mem_gb = 3 },
  { name = "storage", cmd = "bash -c 'cd packages/apsira_storage && flutter analyze && flutter test'", proves = "apsira_storage analyzes and its tests pass", paths = ["packages/apsira_storage/**"], requires = ["file:packages/apsira_storage/pubspec.yaml"], mem_gb = 3 },
  { name = "lock", cmd = "bash -c 'cd packages/apsira_lock && flutter analyze && flutter test'", proves = "apsira_lock analyzes and its tests pass", paths = ["packages/apsira_lock/**"], requires = ["file:packages/apsira_lock/pubspec.yaml"], mem_gb = 3 },
  { name = "db", cmd = "bash -c 'cd packages/apsira_db && flutter analyze && flutter test'", proves = "apsira_db analyzes; the opener, safe mode, server, restore swap, snapshot, migration and fsync tests and its crash matrix (KP-M/R/S/X) pass", paths = ["packages/apsira_db/**"], requires = ["file:packages/apsira_db/pubspec.yaml"], mem_gb = 3 },
  { name = "exchange", cmd = "bash -c 'cd packages/apsira_exchange && dart analyze --fatal-infos && dart test && python3 -m unittest discover -s tool -p \"test_*.py\"'", proves = "apsira_exchange analyzes; the envelope, legacy shapes, dump and loader tests, its crash matrix (KP-E) and validate_examples.py's unittest pass", paths = ["packages/apsira_exchange/**"], requires = ["file:packages/apsira_exchange/pubspec.yaml", "bin:python3"], mem_gb = 1 },
  { name = "zip", cmd = "bash -c 'cd packages/apsira_zip && dart analyze --fatal-infos && dart test'", proves = "apsira_zip analyzes; the writer, CRC-32 and reader tests (RELAY's and LYCEUM's), the app refusal tables and its crash matrix (KP-Z) pass", paths = ["packages/apsira_zip/**"], requires = ["file:packages/apsira_zip/pubspec.yaml"], mem_gb = 1 },
  { name = "notify", cmd = "bash -c 'cd packages/apsira_notify && flutter analyze && flutter test'", proves = "apsira_notify analyzes; the notifier, permission flow, alarm registry tests and its crash matrices (KP-N, KP-A) pass", paths = ["packages/apsira_notify/**"], requires = ["file:packages/apsira_notify/pubspec.yaml"], mem_gb = 3 },
  { name = "link", cmd = "bash -c 'cd packages/apsira_link && flutter analyze && flutter test'", proves = "apsira_link analyzes; the trust core (caller check, fingerprint table, unavailable reasons) and its calls pass", paths = ["packages/apsira_link/**"], requires = ["file:packages/apsira_link/pubspec.yaml"], mem_gb = 3 },
  { name = "check-rules", cmd = "bash tool/test/shared_tag_check_test.sh", proves = "tool/check.sh's shared-tag release rules: six broken trees fail, one passes, an untagged git dependency resolves offline through its override", paths = ["tool/**"], requires = ["file:tool/test/shared_tag_check_test.sh"], mem_gb = 1 },
  { name = "release-sh", cmd = "bash tool/test/release_sh_test.sh", proves = "tool/release.sh refuses in a session and on every unmet precondition; --dry-run prints the check, tag and push", paths = ["tool/**"], requires = ["file:tool/test/release_sh_test.sh"], mem_gb = 1 },
  # APSIRA (master-app/, APSIRA D-026, P0-06). One config for the repository: army reads only the root .army.toml.
  # Static merge gates by path; each stays unavailable until P0 creates its pubspec. P0-06 wires the rest of
  # master-app's tool/ steps (codegen, l10n, layering, deps, manifest) and its area gates here.
  { name = "ma-format", cmd = "bash -c 'cd master-app && dart format --output=none --set-exit-if-changed $(ls -d lib test hub shared tool 2>/dev/null)'", proves = "formatting of APSIRA's app, hub and shared code", paths = ["master-app/**/*.dart"], requires = ["file:master-app/pubspec.yaml"] },
  { name = "ma-analyze", cmd = "bash -c 'cd master-app && flutter analyze'", proves = "APSIRA's app analyzes clean", paths = ["master-app/**"], requires = ["file:master-app/pubspec.yaml"], mem_gb = 3 },
  { name = "ma-hub-analyze", cmd = "bash -c 'cd master-app/hub && dart analyze --fatal-infos'", proves = "APSIRA's hub program analyzes clean", paths = ["master-app/hub/**", "master-app/shared/**"], requires = ["file:master-app/hub/pubspec.yaml"], mem_gb = 1 },
  { name = "check",  cmd = "bash -c 'set -o pipefail; mkdir -p .army; bash tool/check.sh 2>&1 | tee .army/check.log; grep -qx \"check: PASS\" .army/check.log'", proves = "every package and example: analyze + tests; the shared-tag rules (one version, CHANGELOG sections, the git form at apsira-v<version>, overrides = transitive closure); sha256 of fonts and brand", paths = [".army-never-at-merge"], requires = ["file:tool/check.sh", "env:APSIRA_FULL_CHECK"], mem_gb = 3 },
]

[assurance]
critical = []
subsystems = ["packages/apsira_core/**", "packages/apsira_ui/**", "packages/apsira_tools/**", "packages/apsira_test/**", "packages/apsira_app/**", "packages/apsira_jobs/**", "packages/apsira_l10n/**", "packages/apsira_onboarding/**", "packages/apsira_storage/**", "packages/apsira_lock/**", "packages/apsira_db/**", "packages/apsira_exchange/**", "packages/apsira_zip/**", "packages/apsira_notify/**", "packages/apsira_link/**", "master-app/lib/**", "master-app/android/**", "master-app/hub/**", "master-app/shared/**"]
security = []
security_review = false
final_validation = "full"
max_validations = 2
max_tasks_per_validation = 6
review_min = "none"
agent_min_tasks = 3
dedicated_min_size = "L"

[identity]
vision = "README.md"
ecosystem = ["docs/decisions.md", "packages/README.md"]

[network]
allow = ["pub.dev", "storage.googleapis.com"]   # pub fetches for the packages' few dependencies (flutter_lucide, yaml, crypto, workmanager, test)
online = false

[resources]
max_lanes = 3                    # every live unit in this repo together (packages and master-app); host-wide 4 with the sibling apps (APSIRA 07 §1)
max_files_per_task = 40          # a package is one task: its lib/, test/ and fixtures are many small files
gate_mem_gb = 2
stale_after_min = 45

[models]
default = ["opus", "sonnet"]

[rules]
extra = ["docs/agent-rules.md", "master-app/docs/agent-rules.md"]   # the second binds master-app/ tasks only (it says so)
